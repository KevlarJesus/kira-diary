    <script>
      // Если приложение не запустилось, экран должен сказать почему, а не остаться белым.
      (function () {
        function show(what) {
          var root = document.getElementById('root')
          if (!root || root.firstChild) return
          root.innerHTML =
            '<div style="padding:24px;font:400 15px/1.5 system-ui,sans-serif;color:#141414">' +
            '<p style="font-size:19px;margin:0 0 10px">Приложение не запустилось</p>' +
            '<p style="margin:0 0 14px;color:#5c5c5a">Покажите этот текст тому, кто его собирал.</p>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;background:#ececea;border-radius:16px;padding:14px;font:400 12px/1.45 ui-monospace,monospace">' +
            String(what).replace(/</g, '&lt;') +
            '</pre></div>'
        }
        window.addEventListener('error', function (e) {
          show((e.message || 'ошибка') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '\n' + ((e.error && e.error.stack) || ''))
        })
        window.addEventListener('unhandledrejection', function (e) {
          show('unhandled rejection: ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason))
        })
        setTimeout(function () {
          show('Скрипт не выполнился за 8 секунд: вебвью не разобрал сборку или не нашёл файлы.')
        }, 8000)
      })()
    </script>
